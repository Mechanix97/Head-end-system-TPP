[workspace]
members = ["src/scheduler", "src/backdoor", "src/common", "src/metrics"]
resolver = "2"

[package]
name = "hes"
version = "0.1.0"
edition = "2024"

[dependencies]
scheduler = { path = "src/scheduler" }
backdoor = { path = "src/backdoor" }
common = { path = "src/common" }
metrics = { path = "src/metrics" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1.47", features = ["full"] }
clap = { version = "4.5.47", features = ["derive"] }

[workspace.dependencies]
scheduler = { path = "src/scheduler" }
backdoor = { path = "src/backdoor" }
common = { path = "src/common" }
metrics = { path = "src/metrics" }

futures-util = "0.3"
futures = "0.3"
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tokio = "1.47"
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
thiserror = "2.0"
axum = "0.8"
prometheus = "0.14"
bytes = "1.10"
rand = "0.9"
uuid = "1.18"

[lints.clippy]
unwrap_used = "deny"
