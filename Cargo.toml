[workspace]
members = [
    "src/scheduler",
    "src/backdoor",
    "src/common",
    "src/metrics",
    "src/cluster",
    "src/device_manager",
    "src/rpc",
    "tools/mock_registry",
    "tools/mock_device",
    "tools/malformed_registry",
    "tools/hes-cli",
]
resolver = "2"

[package]
name = "hes"
version = "0.1.0"
edition = "2024"

[dependencies]
scheduler = { path = "src/scheduler" }
backdoor = { path = "src/backdoor" }
common = { path = "src/common" }
metrics = { path = "src/metrics" }
cluster = { path = "src/cluster" }
device_manager = { path = "src/device_manager" }
rpc = { path = "src/rpc" }

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
tokio = { version = "1.47", features = ["full", "macros"] }
clap = { version = "4.5.47", features = ["derive"] }
hostname = "0.4"
uuid = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
thiserror = { workspace = true }
async-trait = { workspace = true }
dirs = "6"
regex = "1"

[workspace.dependencies]
scheduler = { path = "src/scheduler" }
backdoor = { path = "src/backdoor" }
common = { path = "src/common" }
metrics = { path = "src/metrics" }
cluster = { path = "src/cluster" }
device_manager = { path = "src/device_manager" }
rpc = { path = "src/rpc" }

futures-util = "0.3"
futures = "0.3"
tokio-util = { version = "0.7", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
clap = { version = "4.5.47", features = ["derive"] }
tokio = { version = "1.47", features = ["full", "macros"] }
tokio-cron-scheduler = { version = "0.15", features = ["signal"] }
thiserror = "2.0"
axum = "0.8"
prometheus = "0.14"
bytes = "1.10"
rand = "0.8"
uuid = { version = "1.18", features = ["v4"] }
chrono = "0.4"
chrono-tz = "0.10"
sqlx = { version = "0.8", features = [
    "runtime-tokio",
    "postgres",
    "chrono",
    "uuid",
] }
hex = "0.4"
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1"
rlp = "0.6"

[lints.clippy]
unwrap_used = "deny"
