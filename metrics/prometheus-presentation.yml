# Scrape config for the single-node demo stack (make run-presentation).
# Only the local node is scraped: no cluster peers are running.
global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'headend_app'
    static_configs:
      - targets:
          - '127.0.0.1:6464'
