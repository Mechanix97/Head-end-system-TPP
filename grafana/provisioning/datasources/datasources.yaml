apiVersion: 1

datasources:
  # Prometheus datasource (existing metrics)
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://localhost:9090
    isDefault: true
    editable: true

  # Infinity datasource for raw metrics (JSON endpoint)
  - name: HES Raw Metrics
    type: yesoreyeram-infinity-datasource
    access: proxy
    url: http://localhost:6464
    isDefault: false
    editable: true
    jsonData:
      auth_method: "none"
