name: Run Make Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up environment
        run: |
          sudo apt-get update
          sudo apt-get install -y make
          # Install dependencies required by your lint target, e.g., yamllint
          sudo apt-get install -y python3-pip
          pip3 install yamllint

      - name: Run make lint
        run: make lint
